<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>College Football TV Guide</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0b0f19;
      --bg-card: #151e2e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-label: #cbd5e1;
      --border-color: #334155;
      --card-border: #1e293b;
      --control-bg: #1e293b;

      /* Accent Border & Badge Colors */
      --accent-elite: #fbbf24;
      --badge-elite-bg: rgba(251, 191, 36, 0.15);
      --badge-elite-text: #fde68a;

      --accent-high: #22d3ee;
      --badge-high-bg: rgba(34, 211, 238, 0.15);
      --badge-high-text: #a5f3fc;

      --accent-good: #60a5fa;
      --badge-good-bg: rgba(96, 165, 250, 0.15);
      --badge-good-text: #bfdbfe;

      --accent-mid: #94a3b8;
      --badge-mid-bg: rgba(148, 163, 184, 0.15);
      --badge-mid-text: #e2e8f0;

      --accent-low: #475569;
      --badge-low-bg: rgba(71, 85, 105, 0.2);
      --badge-low-text: #94a3b8;
    }

    html {
      background-color: var(--bg-primary) !important;
      color-scheme: dark;
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background-color: var(--bg-primary) !important;
      color: var(--text-main) !important;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      margin: 0 0 6px 0;
      color: var(--text-main);
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    header p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 140px;
      max-width: 220px;
    }

    label {
      font-size: 0.7rem;
      color: var(--text-label);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    input, select {
      background-color: var(--control-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 14px;
      padding-right: 28px;
    }

    input:focus, select:focus {
      border-color: #60a5fa !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 1100px;
    }

    /* Card Layout */
    .card {
      background-color: var(--bg-card) !important;
      border: 1px solid var(--card-border) !important;
      border-left: 5px solid var(--border-color) !important;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    /* Graduated Tier Borders */
    .card.score-elite {
      border-left-width: 15px !important;
      border-left-color: var(--accent-elite) !important;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.15), 0 1px 3px 0 rgba(0, 0, 0, 0.3);
    }
    .card.score-high {
      border-left-width: 12px !important;
      border-left-color: var(--accent-high) !important;
    }
    .card.score-good {
      border-left-width: 9px !important;
      border-left-color: var(--accent-good) !important;
    }
    .card.score-mid {
      border-left-width: 6px !important;
      border-left-color: var(--accent-mid) !important;
    }
    .card.score-low {
      border-left-width: 3px !important;
      border-left-color: var(--accent-low) !important;
    }

    /* 3-Column Header: Time/Status | Network | Score */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.775rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-live {
      color: #ef4444 !important;
      animation: pulse 1.8s infinite;
    }

    .status-final {
      color: #94a3b8 !important;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .network {
      font-size: 0.775rem;
      color: var(--text-muted);
      font-weight: 600;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 4px;
    }

    .score-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    /* Tier Score Badges */
    .score-badge.score-elite {
      background-color: var(--badge-elite-bg) !important;
      color: var(--badge-elite-text) !important;
      border-color: var(--accent-elite) !important;
    }
    .score-badge.score-high {
      background-color: var(--badge-high-bg) !important;
      color: var(--badge-high-text) !important;
      border-color: var(--accent-high) !important;
    }
    .score-badge.score-good {
      background-color: var(--badge-good-bg) !important;
      color: var(--badge-good-text) !important;
      border-color: var(--accent-good) !important;
    }
    .score-badge.score-mid {
      background-color: var(--badge-mid-bg) !important;
      color: var(--badge-mid-text) !important;
      border-color: var(--accent-mid) !important;
    }
    .score-badge.score-low {
      background-color: var(--badge-low-bg) !important;
      color: var(--badge-low-text) !important;
      border-color: var(--accent-low) !important;
    }

    /* Stacked Team & Score Container */
    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      line-height: 1.25;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 8px;
    }

    .team-score {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
      min-width: 24px;
      text-align: right;
    }

    .no-games {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      margin-top: 32px;
      font-size: 1rem;
    }
  </style>
  <script data-goatcounter="https://cfb-guide.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header>
    <h1>College 🏈 TV Guide</h1>
    <p>Some FCS and G6 games are omitted. Neutral site games appear without site location. All times Central.</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="datePicker">Date</label>
      <select id="datePicker"></select>
    </div>

    <div class="control-group">
      <label for="scoreFilter">Minimum Watch Score</label>
      <select id="scoreFilter">
        <option value="0" selected>All Games (0+)</option>
        <option value="5">I Am Bored (5+)</option>
        <option value="11">Beats Yardwork (11+)</option>
        <option value="18">Heck Yes! (18+)</option>
        <option value="22">Risk Divorce (22+)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="teamFilter">Team Search</label>
      <input type="text" id="teamFilter" placeholder="e.g. LSU, Texas..." list="teamList" autocomplete="off">
      <datalist id="teamList"></datalist>
    </div>

    <div class="control-group">
      <label for="confFilter">Conference</label>
      <select id="confFilter">
        <option value="">All Conferences</option>
      </select>
    </div>

    <div class="control-group">
      <label for="networkFilter">Network</label>
      <select id="networkFilter">
        <option value="">All Networks</option>
      </select>
    </div>

    <div class="control-group">
      <label for="timeFilter">Time Slot</label>
      <select id="timeFilter">
        <option value="">All Times</option>
        <option value="early">Early (Before 2:30pm)</option>
        <option value="afternoon">Afternoon (2:30pm–5:59pm)</option>
        <option value="night">Night (6:00pm & later)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="sortBy">Sort By</label>
      <select id="sortBy">
        <option value="time">Game Time</option>
        <option value="score">Score (High to Low)</option>
        <option value="network">Network (A–Z)</option>
      </select>
    </div>
  </div>

  <div class="grid" id="gamesGrid"></div>

  <script>
    let allGames = [];
    let teamsLookup = {};
    let liveScoresMap = {};

    // Your live Cloudflare Worker proxy
    const SCOREBOARD_API = 'https://polished-darkness-803e.smdesforges.workers.dev';

    const ALIAS_GROUPS = {
      "North Carolina": ["UNC"],
      "Ole Miss": ["Mississippi", "Rebels", "Ole Miss Rebels", "Univ of Mississippi"],
      "Pittsburgh": ["Pitt"],
      "Connecticut": ["UConn"],
      "NC State": ["North Carolina State"],
      "UMass": ["Massachusetts"],
      "USF": ["South Florida"],
      "FAU": ["Florida Atlantic"],
      "FIU": ["Florida International"],
      "UTEP": ["Texas-El Paso"],
      "UTSA": ["Texas-San Antonio"],
      "UL Monroe": ["Louisiana-Monroe"],
      "ULM": ["Louisiana-Monroe"],
      "Louisiana": ["Louisiana-Lafayette"],
      "ULL": ["Louisiana-Lafayette"],
      "Middle Tennessee": ["Middle Tennessee State"],
      "MTSU": ["Middle Tennessee State"],
      "WKU": ["Western Kentucky"],
      "ETSU": ["East Tennessee State"],
      "NMSU": ["New Mexico State"],
      "SMU": ["Southern Methodist"],
      "TCU": ["Texas Christian"],
      "BYU": ["Brigham Young"],
      "UCF": ["Central Florida"],
      "UNLV": ["Nevada-Las Vegas"],

      // Directional & State Variants
      "Southern Cal": ["USC"],
      "App State": ["Appalachian State"],
      "Sam Houston": ["Sam Houston State"],
      "San Jose State": ["San José State"],
      "Hawai'i": ["Hawaii"],
      "Miami (FL)": ["Miami"],
      "Miami (OH)": ["Miami (Ohio)"],
      "UL Monroe Warhawks": ["Louisiana-Monroe"],
      "Southeastern Louisiana": ["SE Louisiana", "Southeast LA", "Southeastern La."],
      
      // Punctuation & St. vs Saint
      "St. Bonaventure": ["Saint Bonaventure"],
      "Saint Mary's": ["St. Mary's"]
    };

    // Auto-build flat lookup dictionary
    const TEAM_ALIASES = {};
    for (const [canonical, aliases] of Object.entries(ALIAS_GROUPS)) {
      aliases.forEach(alias => {
        TEAM_ALIASES[alias.toLowerCase().trim()] = canonical;
      });
    }

    function cleanTeamName(name) {
      if (!name) return '';
      const trimmed = name.trim().toLowerCase();
      if (TEAM_ALIASES[trimmed]) {
        name = TEAM_ALIASES[trimmed];
      }

      return name.toLowerCase()
        .replace(/[\.\']/g, '')
        .replace(/\bst\b/g, 'state')
        .replace(/\bso\b/g, 'southern')
        .replace(/\bga\b/g, 'georgia')
        .replace(/\bfla\b/g, 'florida')
        .replace(/\bill\b/g, 'illinois')
        .replace(/\bky\b/g, 'kentucky')
        .replace(/\bva\b/g, 'virginia')
        .replace(/\bcaro\b/g, 'carolina')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseMatchup(matchupStr) {
      if (!matchupStr) return { away: '', home: '' };
      const parts = matchupStr.split(/\s+(?:at|vs\.?)\s+/i);
      return {
        away: parts[0] ? parts[0].trim() : '',
        home: parts[1] ? parts[1].trim() : ''
      };
    }

    function computeWatchScore(matchupStr) {
      const { away, home } = parseMatchup(matchupStr);
      const awayData = teamsLookup[away] || { teamValue: 0, confValue: 0, conference: 'ZERO' };
      const homeData = teamsLookup[home] || { teamValue: 0, confValue: 0, conference: 'ZERO' };
      return (awayData.teamValue || 0) + (awayData.confValue || 0) + (homeData.teamValue || 0) + (homeData.confValue || 0);
    }

    function formatDateLabel(dateStr) {
      const [year, month, day] = dateStr.split('-').map(Number);
      const dateObj = new Date(year, month - 1, day);
      return dateObj.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function getNearestFutureDate(games) {
      if (!games || games.length === 0) return '';
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const todayStr = `${year}-${month}-${day}`;
      const uniqueDates = [...new Set(games.map(g => g.date))].sort();
      const nextFutureDate = uniqueDates.find(d => d >= todayStr);
      return nextFutureDate || uniqueDates[uniqueDates.length - 1];
    }

    function parseTimeString(timeStr) {
      if (!timeStr || timeStr.toUpperCase() === 'TBD') return 9999;
      const match = timeStr.trim().match(/^(\d+):(\d+)\s*(am|pm)$/i);
      if (!match) return 9999;
      let hours = parseInt(match[1], 10);
      const minutes = parseInt(match[2], 10);
      const period = match[3].toLowerCase();
      if (period === 'pm' && hours < 12) hours += 12;
      if (period === 'am' && hours === 12) hours = 0;
      return hours * 60 + minutes;
    }

    function getScoreClass(score) {
      if (score >= 22) return 'score-elite';
      if (score >= 18) return 'score-high';
      if (score >= 11) return 'score-good';
      if (score >= 5)  return 'score-mid';
      return 'score-low';
    }

    function matchLiveGame(away, home) {
      const cAway = cleanTeamName(away);
      const cHome = cleanTeamName(home);

      // Direct Match (Away_Home)
      if (liveScoresMap[`${cAway}_${cHome}`]) {
        return liveScoresMap[`${cAway}_${cHome}`];
      }

      // Reversed Order Match (Home_Away)
      if (liveScoresMap[`${cHome}_${cAway}`]) {
        const item = liveScoresMap[`${cHome}_${cAway}`];
        return {
          ...item,
          awayScore: item.homeScore,
          homeScore: item.awayScore
        };
      }

      // Fuzzy check across all active games in feed
      for (const key in liveScoresMap) {
        const item = liveScoresMap[key];
        const sbAway = cleanTeamName(item.awayName);
        const sbHome = cleanTeamName(item.homeName);

        // Standard direction fuzzy match
        if (
          (cAway.includes(sbAway) || sbAway.includes(cAway)) &&
          (cHome.includes(sbHome) || sbHome.includes(cHome))
        ) {
          return item;
        }

        // Reversed direction fuzzy match
        if (
          (cAway.includes(sbHome) || sbHome.includes(cAway)) &&
          (cHome.includes(sbAway) || sbAway.includes(cHome))
        ) {
          return {
            ...item,
            awayScore: item.homeScore,
            homeScore: item.awayScore
          };
        }
      }

      return null;
    }

    function renderGames() {
      const selectedDate = document.getElementById('datePicker').value;
      const minScore = parseInt(document.getElementById('scoreFilter').value, 10);
      const teamSearch = (document.getElementById('teamFilter').value || '').trim().toLowerCase();
      const selectedConf = document.getElementById('confFilter').value;
      const selectedNetwork = document.getElementById('networkFilter').value;
      const selectedTimeSlot = document.getElementById('timeFilter').value;
      const sortCriteria = document.getElementById('sortBy').value;

      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      let filtered = allGames.filter(game => {
        const matchesDate = !selectedDate || game.date === selectedDate;
        const matchesScore = (game.score || 0) >= minScore;
        const matchesTeam = !teamSearch || game.matchup.toLowerCase().includes(teamSearch);

        let matchesConf = true;
        if (selectedConf) {
          const { away, home } = parseMatchup(game.matchup);
          const awayConf = teamsLookup[away]?.conference || '';
          const homeConf = teamsLookup[home]?.conference || '';
          matchesConf = (awayConf === selectedConf || homeConf === selectedConf);
        }

        const matchesNetwork = !selectedNetwork || game.network === selectedNetwork;

        let matchesTimeSlot = true;
        if (selectedTimeSlot) {
          const minutes = parseTimeString(game.time);
          if (selectedTimeSlot === 'early') {
            matchesTimeSlot = minutes < (14 * 60 + 30);
          } else if (selectedTimeSlot === 'afternoon') {
            matchesTimeSlot = minutes >= (14 * 60 + 30) && minutes < (18 * 60);
          } else if (selectedTimeSlot === 'night') {
            matchesTimeSlot = minutes >= (18 * 60) && minutes < 9999;
          }
        }

        return matchesDate && matchesScore && matchesTeam && matchesConf && matchesNetwork && matchesTimeSlot;
      });

      filtered.sort((a, b) => {
        if (sortCriteria === 'score') {
          return (b.score || 0) - (a.score || 0);
        } else if (sortCriteria === 'network') {
          return (a.network || '').localeCompare(b.network || '');
        } else {
          return parseTimeString(a.time) - parseTimeString(b.time);
        }
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-games">No games match your filters.</div>';
        return;
      }

      filtered.forEach(game => {
        const { away, home } = parseMatchup(game.matchup);
        const live = matchLiveGame(away, home);

        let statusHtml = `<span class="status-badge">${game.time}</span>`;
        let awayScore = '';
        let homeScore = '';

        if (live) {
          const state = (live.gameState || '').toLowerCase();

          if (state === 'live' || state === 'in_progress' || state === 'inprogress') {
            const clock = (live.clock && live.clock !== ':') ? ` ${live.clock}` : '';
            statusHtml = `<span class="status-badge status-live">🔴 ${live.period}${clock}</span>`;
            awayScore = live.awayScore !== '' ? live.awayScore : '0';
            homeScore = live.homeScore !== '' ? live.homeScore : '0';
          } else if (state === 'final' || state === 'f') {
            statusHtml = `<span class="status-badge status-final">FINAL</span>`;
            awayScore = live.awayScore ?? '';
            homeScore = live.homeScore ?? '';
          }
        }

        const scoreClass = getScoreClass(game.score || 0);
        const card = document.createElement('div');
        card.className = `card ${scoreClass}`;
        card.innerHTML = `
          <div class="card-header">
            ${statusHtml}
            <span class="network">📺 ${game.network}</span>
            <span class="score-badge ${scoreClass}">Score: ${game.score}</span>
          </div>
          <div class="teams-container">
            <div class="team-row">
              <span class="team-name">${away || 'Away'}</span>
              <span class="team-score">${awayScore}</span>
            </div>
            <div class="team-row">
              <span class="team-name">${home || 'Home'}</span>
              <span class="team-score">${homeScore}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function populateDropdowns() {
      const teamDatalist = document.getElementById('teamList');
      const sortedTeams = Object.keys(teamsLookup).sort((a, b) => a.localeCompare(b));
      teamDatalist.innerHTML = '';
      sortedTeams.forEach(team => {
        const option = document.createElement('option');
        option.value = team;
        teamDatalist.appendChild(option);
      });

      const uniqueDates = [...new Set(allGames.map(g => g.date))].sort();
      const dateSelect = document.getElementById('datePicker');
      dateSelect.innerHTML = '<option value="">All Dates</option>';
      uniqueDates.forEach(date => {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = formatDateLabel(date);
        dateSelect.appendChild(option);
      });
      dateSelect.value = getNearestFutureDate(allGames);

      const confSelect = document.getElementById('confFilter');
      const uniqueConfs = [...new Set(
        Object.values(teamsLookup).map(t => t.conference).filter(c => c && c !== 'ZERO' && c !== 'FCS')
      )].sort();
      confSelect.innerHTML = '<option value="">All Conferences</option>';
      uniqueConfs.forEach(conf => {
        const option = document.createElement('option');
        option.value = conf;
        option.textContent = conf;
        confSelect.appendChild(option);
      });

      const networkSelect = document.getElementById('networkFilter');
      const uniqueNetworks = [...new Set(allGames.map(g => g.network).filter(Boolean))].sort();
      networkSelect.innerHTML = '<option value="">All Networks</option>';
      uniqueNetworks.forEach(net => {
        const option = document.createElement('option');
        option.value = net;
        option.textContent = net;
        networkSelect.appendChild(option);
      });
    }

    function parseScoreboardPayload(scoreData) {
      if (scoreData && Array.isArray(scoreData.games)) {
        const nextScores = {};

        scoreData.games.forEach(g => {
          const gm = g.game;
          if (!gm) return;
          const awayShort = gm.away?.names?.short || '';
          const homeShort = gm.home?.names?.short || '';
          const key = `${cleanTeamName(awayShort)}_${cleanTeamName(homeShort)}`;

          nextScores[key] = {
            awayName: awayShort,
            homeName: homeShort,
            awayScore: gm.away?.score || '',
            homeScore: gm.home?.score || '',
            gameState: gm.gameState,
            period: gm.currentPeriod || gm.finalMessage || '',
            clock: gm.contestClock || ''
          };
        });

        liveScoresMap = nextScores;
      }
    }

    async function fetchScoreboardData() {
      try {
        const res = await fetch(`${SCOREBOARD_API}?_t=${Date.now()}`, {
          cache: 'no-store'
        });

        if (!res.ok) {
          console.warn(`Worker returned status: ${res.status}`);
          return null;
        }

        const data = await res.json();
        if (data && Array.isArray(data.games)) {
          return data;
        }
      } catch (err) {
        console.warn('Scoreboard fetch error:', err);
      }
      return null;
    }

    async function loadGames() {
      try {
        // Step 1: Always load schedule and teams first so the UI never breaks
        const [gamesRes, teamsRes] = await Promise.all([
          fetch('games.json'),
          fetch('teams.json')
        ]);

        const rawGames = await gamesRes.json();
        teamsLookup = await teamsRes.json();

        allGames = rawGames.map(game => ({
          ...game,
          score: computeWatchScore(game.matchup)
        }));

        if (allGames && allGames.length > 0) {
          populateDropdowns();
        }

        renderGames();

        // Step 2: Fetch live scores in the background
        refreshScores();
      } catch (err) {
        console.error('Error loading games data:', err);
      }
    }

    async function refreshScores() {
      try {
        const scoreData = await fetchScoreboardData();
        if (scoreData) {
          parseScoreboardPayload(scoreData);
          renderGames();
        }
      } catch (err) {
        console.warn('Silent score refresh failed:', err);
      }
    }

    document.getElementById('datePicker').addEventListener('change', renderGames);
    document.getElementById('scoreFilter').addEventListener('change', renderGames);
    document.getElementById('teamFilter').addEventListener('input', renderGames);
    document.getElementById('confFilter').addEventListener('change', renderGames);
    document.getElementById('networkFilter').addEventListener('change', renderGames);
    document.getElementById('timeFilter').addEventListener('change', renderGames);
    document.getElementById('sortBy').addEventListener('change', renderGames);

    // Initial Load
    loadGames();

    // Poll live scores every 30 seconds
    setInterval(refreshScores, 30000);
  </script>
</body>
</html>
